    /**
     * 切换主模块显示
     * @param {string} moduleId - 要显示的模块ID ('module-a', 'module-b', 'module-c')
     */
    function showModule(moduleId) {
        if (moduleId === 'cover-module') {
            document.getElementById('cover-module').classList.add('visible-content');
            document.getElementById('cover-module').classList.remove('hidden-content');
            document.getElementById('main-app').classList.add('hidden-content');
            return;
        }

        // 隐藏封面页并显示主应用框架
        document.getElementById('cover-module').classList.add('hidden-content');
        document.getElementById('main-app').classList.remove('hidden-content');

        ALL_MODULES.forEach(id => {
            const el = document.getElementById(id);
            if (!el || id === 'cover-module') return;

            if (id === moduleId) {
                el.classList.add('visible-content');
                el.classList.remove('hidden-content');
            } else {
                el.classList.add('hidden-content');
                el.classList.remove('visible-content');
            }
        });
        
        // 导航栏样式切换
        for (const navId in NAV_RECTS) {
            const rect = NAV_RECTS[navId];
            const text = NAV_TEXTS[navId];
            if (navId === moduleId) {
                // Active style: Gold background, Deep Blue text
                rect.setAttribute('fill', '#FFD700');
                text.setAttribute('fill', '#172554');
                rect.removeAttribute('stroke');
            } else {
                // Inactive style: Deep Blue background, Gold text
                rect.setAttribute('fill', '#172554');
                rect.setAttribute('stroke', '#FFD700');
                rect.setAttribute('stroke-width', '2');
                text.setAttribute('fill', '#FFD700');
            }
        }
    }

    /**
     * 切换句型模块 (Module A) 的详情显示
     * @param {string} groupId - 包含详情的 <g> 元素的ID
     */
    function toggleDetail(groupId) {
        const details = document.querySelectorAll(`.${groupId}-content`);
        details.forEach(detail => {
            detail.classList.toggle('hidden-content');
            detail.classList.toggle('visible-content');
        });
    }

    /**
     * 切换词汇模块 (Module B) 的详情显示
     * @param {string} groupId - 包含词汇详情的 <g> 元素的ID (e.g., 'b1-vocab-1')
     */
    function toggleVocab(groupId) {
        const details = document.querySelectorAll(`.vocab-detail-${groupId}`);
        details.forEach(detail => {
            detail.classList.toggle('hidden-content');
            detail.classList.toggle('visible-content');
        });
    }


    /**
     * 检查填空题答案 (C1)
     */
    function checkFillIn() {
        let correctCount = 0;
        const total = FILL_IN_ANSWERS.length;

        for (let i = 1; i <= total; i++) {
            const inputBg = document.getElementById(`input-bg-${i}`);
            const inputText = document.getElementById(`input-text-${i}`);
            
            // 模拟用户输入（在 Canvas 环境中，使用 prompt 获取值）
            const userAnswer = prompt(`请输入第 ${i} 题的答案: (正确答案: ${FILL_IN_ANSWERS[i-1]})`);
            
            if (userAnswer === null) {
                // 用户取消输入
                inputText.textContent = '输入取消';
                inputBg.setAttribute('fill', '#AAAAAA');
                continue;
            }

            const cleanAnswer = userAnswer.trim().toLowerCase();
            const correctAnswer = FILL_IN_ANSWERS[i - 1];

            inputText.textContent = userAnswer; // 显示用户输入

            if (cleanAnswer === correctAnswer) {
                correctCount++;
                inputBg.setAttribute('fill', '#10B981'); // Green
                inputText.setAttribute('fill', '#FFFFFF');
            } else {
                // 显示正确答案和用户的输入
                inputText.textContent = `${userAnswer} (正: ${correctAnswer})`;
                inputBg.setAttribute('fill', '#EF4444'); // Red
                inputText.setAttribute('fill', '#FFFFFF');
            }
        }

        const feedbackText = document.getElementById('fillin-feedback');
        feedbackText.textContent = `得分：${correctCount} / ${total}`;
        feedbackText.setAttribute('fill', correctCount === total ? '#10B981' : '#EF4444');
    }

    /**
     * 检查选择题答案 (C2)
     * @param {number} qId - 题号 (6-10)
     * @param {string} selectedOption - 选中的选项 ('A', 'B', 'C', 'D')
     */
    function checkMCQ(qId, selectedOption) {
        if (mcqStates[qId] === 'checked') return; // 已检查，不再响应

        const correct = MCQ_ANSWERS[qId];
        const optionsGroup = document.getElementById(`mcq${qId}-options`);
        const options = optionsGroup.children;

        for (let i = 0; i < options.length; i++) {
            const optionG = options[i];
            const optionId = optionG.id.slice(-1).toUpperCase(); // 'A', 'B', 'C', 'D'
            const optionRect = optionG.querySelector('rect');
            
            // 1. 重置所有选项的颜色
            optionRect.classList.remove('mcq-correct', 'mcq-wrong', 'mcq-selected');
            
            if (optionId === selectedOption) {
                // 2. 处理用户选择的选项
                if (selectedOption === correct) {
                    optionRect.classList.add('mcq-correct');
                } else {
                    optionRect.classList.add('mcq-wrong');
                    // 标记错误，但不退出循环，继续标记正确答案
                }
            }
            
            // 3. 标记正确答案
            if (optionId === correct) {
                // 如果用户选错，则正确答案应显示为提示色（此处使用金色作为提示）
                if (selectedOption !== correct) {
                   optionRect.classList.add('mcq-selected');
                }
            }
        }
        
        mcqStates[qId] = 'checked';
    }

    /**
     * 获取当前页面的完整 HTML 内容并触发下载。
     * 这是一个通用的下载函数，在 Canvas 环境中，它会下载当前显示的代码。
     */
    function downloadCurrentHTML() {
        // 获取完整的 HTML 字符串
        const htmlContent = document.documentElement.outerHTML;
        
        // 创建 Blob 对象
        const blob = new Blob([htmlContent], { type: 'text/html' });
        
        // 创建一个临时的 URL 和链接元素
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        
        // 设置下载文件名
        a.download = 'Timur_Gareyev_Interactive_Course.html';
        a.href = url;
        
        // 模拟点击触发下载
        document.body.appendChild(a);
        a.click();
        
        // 清理
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    // 默认显示封面页
    document.addEventListener('DOMContentLoaded', () => {
        initializeNavElements();
        showModule('cover-module');
    });

</script>
